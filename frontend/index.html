<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Vonage Video 多言語字幕デモ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@vonage/client-sdk-video@2/dist/js/opentok.min.js"></script>
</head>
<body>
  <!-- ログイン画面 -->
  <main id="login-view" class="view">
    <form id="login-form" class="card" autocomplete="off">
      <h1 data-i18n="title"></h1>
      <p class="muted" data-i18n="subtitle"></p>
      <label class="field">
        <span data-i18n="name"></span>
        <input id="name" name="name" maxlength="20" required enterkeyhint="go">
      </label>
      <fieldset class="field">
        <legend data-i18n="lang"></legend>
        <div class="segmented">
          <label><input type="radio" name="lang" value="ja" checked><span>日本語</span></label>
          <label><input type="radio" name="lang" value="en"><span>English</span></label>
        </div>
      </fieldset>
      <!-- バーチャル背景（非対応の端末では表示しない） -->
      <fieldset id="bg-field" class="field" hidden>
        <legend data-i18n="background"></legend>
        <div id="bg-options" class="bg-options" role="radiogroup"></div>
      </fieldset>
      <p class="muted small"><span data-i18n="room"></span>: <b id="room-label"></b></p>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-btn" type="submit" class="primary" data-i18n="login"></button>
    </form>
    <!-- リンク先 URL・UTM パラメーターは frontend/config.js で設定 -->
    <a id="powered-by" class="powered-by" href="https://kwcplus.kddi-web.com/service/vonage" target="_blank" rel="noopener">Powered by Vonage</a>
  </main>

  <!-- 会議室 -->
  <main id="room-view" class="view" hidden>
    <header id="timer" aria-live="off"><span class="label"></span><span class="value">3:00</span></header>
    <div id="grid" data-count="1"></div>
    <p id="waiting" class="waiting" data-i18n="waiting"></p>
    <section id="captions" aria-live="polite"></section>
    <nav id="controls">
      <button id="mic-btn" class="ctrl" type="button">
        <svg class="on" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M19 11h-2c0 .74-.16 1.43-.43 2.05l1.47 1.47A6.9 6.9 0 0 0 19 11zM15 11.16V5a3 3 0 0 0-5.94-.6L15 10.34v.82zM4.27 3 3 4.27l6 6V11a3 3 0 0 0 4.46 2.63l1.66 1.66A5 5 0 0 1 7 11H5a7 7 0 0 0 6 6.92V21h2v-3.08a6.9 6.9 0 0 0 3.32-1.3L19.73 21 21 19.73 4.27 3z"/></svg>
        <span class="label"></span>
      </button>
      <button id="cam-btn" class="ctrl" type="button">
        <svg class="on" viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7a1 1 0 0 0-1-1H9.82L21 17.18V6.5zM3.27 2 2 3.27 4.73 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12c.21 0 .39-.08.55-.18L19.73 21 21 19.73 3.27 2z"/></svg>
        <span class="label"></span>
      </button>
      <button id="leave-btn" class="ctrl danger" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a1 1 0 0 1-1.41-.02L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.47a1 1 0 0 1-1.41.02 11.27 11.27 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A15.9 15.9 0 0 0 12 9z"/></svg>
        <span class="label" data-i18n="leave"></span>
      </button>
    </nav>
    <p id="room-error" class="toast" role="alert" hidden></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
